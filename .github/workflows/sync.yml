name: Sync Salesforce to Dashboard

on:
  schedule:
    # 11:17 UTC = 06:17 en Ecuador (UTC-5, sin horario de verano).
    # El minuto :17 evita la hora en punto, donde GitHub encola y retrasa los crons.
    # Para correr dos veces al día: '17 11,23 * * *'
    - cron: '17 11 * * *'
  workflow_dispatch:

# Si un run se retrasa, no dejar que dos syncs se pisen empujando commits a la vez.
concurrency:
  group: salesforce-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # necesario para commitear dashboard.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar que los secrets existan
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}
        run: |
          missing=""
          [ -z "$SF_USERNAME" ]    && missing="$missing SF_USERNAME"
          [ -z "$SF_CLIENT_ID" ]   && missing="$missing SF_CLIENT_ID"
          [ -z "$SF_PRIVATE_KEY" ] && missing="$missing SF_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secrets del repo:$missing — agrégalos en Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "Secrets presentes."

      - name: Instalar dependencias del sync
        working-directory: scripts
        run: npm install

      - name: Escribir y validar la llave privada de Salesforce
        env:
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}
        run: |
          node - <<'JS'
          const crypto = require("crypto");
          const fs = require("fs");
          // El secret puede llegar con saltos de línea reales, con "\n" literales
          // o todo en una sola línea, según cómo se haya pegado en GitHub.
          // Reconstruimos el PEM a partir del base64 en los tres casos.
          const raw = (process.env.SF_PRIVATE_KEY || "").trim();
          const type = /BEGIN RSA PRIVATE KEY/.test(raw) ? "RSA PRIVATE KEY" : "PRIVATE KEY";
          const body = raw
            .replace(/-----(BEGIN|END)[A-Z ]*-----/g, "")
            .replace(/\\n/g, "")
            .replace(/\s+/g, "");
          if (!body) {
            console.log("::error::SF_PRIVATE_KEY llegó vacío o sin cuerpo base64.");
            process.exit(1);
          }
          const pem = `-----BEGIN ${type}-----\n${body.replace(/(.{64})/g, "$1\n").replace(/\n$/, "")}\n-----END ${type}-----\n`;
          let key;
          try {
            key = crypto.createPrivateKey(pem);
          } catch (e) {
            console.log(`::error::SF_PRIVATE_KEY no es una llave válida (${e.message}). Pega de nuevo el contenido completo de scripts/server.key, incluidas las líneas BEGIN y END.`);
            process.exit(1);
          }
          fs.writeFileSync("scripts/server.key", pem, { mode: 0o600 });
          // La huella es de la parte PÚBLICA: no es secreta, y sirve para confirmar
          // que el secret corresponde al server.crt cargado en la Connected App.
          const pub = crypto.createPublicKey(key).export({ type: "spki", format: "der" });
          console.log("Llave OK:", key.asymmetricKeyType, `${key.asymmetricKeyDetails?.modulusLength ?? "?"} bits`);
          console.log("Huella SHA256 (pública):", crypto.createHash("sha256").update(pub).digest("base64"));
          JS

      - name: Correr el sync de Salesforce
        working-directory: scripts
        env:
          SF_LOGIN_URL: https://login.salesforce.com
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_PRIVATE_KEY_PATH: ./server.key
          OUTPUT_PATH: ../dashboard-app/public/data/dashboard.json
        run: node sync-salesforce.js

      - name: Borrar la llave privada
        if: always()
        run: rm -f scripts/server.key

      - name: Avisar si el sync dejó advertencias
        run: |
          node -e "
            const d = require('./dashboard-app/public/data/dashboard.json');
            const w = d.syncWarnings || [];
            if (w.length) {
              console.log('::warning::' + w.length + ' advertencia(s) del sync: ' + JSON.stringify(w));
            } else {
              console.log('Sin advertencias.');
            }
          "

      - name: Commitear los datos nuevos (dispara el deploy en Vercel)
        run: |
          if git diff --quiet -- dashboard-app/public/data/dashboard.json; then
            echo "dashboard.json sin cambios — no hay nada que publicar."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-app/public/data/dashboard.json
          git commit -m "chore(data): sync Salesforce ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
          echo "Publicado. Vercel reconstruye solo con el push a main."
